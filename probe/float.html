<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';">
<title>录音控制</title><link rel="stylesheet" href="style.css"></head>
<body class="floating"><div id="bar"><span id="label" role="status">未开始</span>
<button id="pause" aria-label="暂停录音" title="暂停录音">Ⅱ</button>
<button id="stop" aria-label="结束录音" title="结束录音">■</button>
<button id="open" aria-label="返回录音窗口" title="返回录音窗口">↗</button>
</div><script src="float.js"></script></body></html>
